name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/appplus_ci
      AUTH_SECRET: ci-auth-secret-not-for-production
      STORAGE_DRIVER: local
      PRIVATE_STORAGE_PATH: .data/storage
      SENTRY_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appplus_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appplus_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run db:generate

      - name: Prisma migrate deploy
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

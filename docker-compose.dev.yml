services:
  postgres_athlone:
    image: postgres:16
    container_name: casino-athlone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appplus_athlone
    ports:
      - "5433:5432"
    volumes:
      - appplus_athlone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appplus_athlone"]
      interval: 10s
      timeout: 5s
      retries: 10

  app_athlone:
    image: node:22-alpine
    container_name: casino-athlone-app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run db:generate && npm run db:migrate && npm run db:seed && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_athlone:5432/appplus_athlone
      AUTH_SECRET: athlone-super-secret-change-me
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3001
      NODE_ENV: development
      SEED_DEFAULT_PASSWORD: Change123!
      STORAGE_DRIVER: local
      PRIVATE_STORAGE_PATH: .data/storage
      DEFAULT_CURRENCY: EUR
    ports:
      - "3001:3000"
    depends_on:
      postgres_athlone:
        condition: service_healthy
    volumes:
      - ./:/app
      - appplus_athlone_node_modules:/app/node_modules

  postgres_mullingar:
    image: postgres:16
    container_name: casino-mullingar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appplus_mullingar
    ports:
      - "5434:5432"
    volumes:
      - appplus_mullingar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appplus_mullingar"]
      interval: 10s
      timeout: 5s
      retries: 10

  app_mullingar:
    image: node:22-alpine
    container_name: casino-mullingar-app
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm ci && npm run db:generate && npm run db:migrate && npm run db:seed && npm run dev -- --hostname 0.0.0.0 --port 3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres_mullingar:5432/appplus_mullingar
      AUTH_SECRET: mullingar-super-secret-change-me
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3002
      NODE_ENV: development
      SEED_DEFAULT_PASSWORD: Change123!
      STORAGE_DRIVER: local
      PRIVATE_STORAGE_PATH: .data/storage
      DEFAULT_CURRENCY: EUR
    ports:
      - "3002:3000"
    depends_on:
      postgres_mullingar:
        condition: service_healthy
    volumes:
      - ./:/app
      - appplus_mullingar_node_modules:/app/node_modules

  backup_athlone:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-athlone-backup
    restart: unless-stopped
    depends_on:
      postgres_athlone:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/backup.sh athlone postgres_athlone 5432 ${ATHLONE_DB_NAME:-appplus_athlone} ${ATHLONE_DB_USER:-postgres} ${ATHLONE_DB_PASSWORD:-postgres} /app/backups ${BACKUP_RETENTION_DAYS:-14}; sleep ${BACKUP_INTERVAL_SECONDS:-86400}; done"

  backup_mullingar:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-mullingar-backup
    restart: unless-stopped
    depends_on:
      postgres_mullingar:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/backup.sh mullingar postgres_mullingar 5432 ${MULLINGAR_DB_NAME:-appplus_mullingar} ${MULLINGAR_DB_USER:-postgres} ${MULLINGAR_DB_PASSWORD:-postgres} /app/backups ${BACKUP_RETENTION_DAYS:-14}; sleep ${BACKUP_INTERVAL_SECONDS:-86400}; done"


  backup_verify_athlone:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-athlone-backup-verify
    restart: unless-stopped
    depends_on:
      postgres_athlone:
        condition: service_healthy
      backup_athlone:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/restore-smoke.sh athlone postgres_athlone 5432 ${ATHLONE_DB_NAME:-appplus_athlone} ${ATHLONE_DB_USER:-postgres} ${ATHLONE_DB_PASSWORD:-postgres} /app/backups; sleep ${BACKUP_VERIFY_INTERVAL_SECONDS:-604800}; done"

  backup_verify_mullingar:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-mullingar-backup-verify
    restart: unless-stopped
    depends_on:
      postgres_mullingar:
        condition: service_healthy
      backup_mullingar:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/restore-smoke.sh mullingar postgres_mullingar 5432 ${MULLINGAR_DB_NAME:-appplus_mullingar} ${MULLINGAR_DB_USER:-postgres} ${MULLINGAR_DB_PASSWORD:-postgres} /app/backups; sleep ${BACKUP_VERIFY_INTERVAL_SECONDS:-604800}; done"

volumes:
  appplus_athlone_pgdata:
  appplus_mullingar_pgdata:
  appplus_athlone_node_modules:
  appplus_mullingar_node_modules:

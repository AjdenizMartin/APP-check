services:
  postgres_athlone:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ATHLONE_DB_USER}
      POSTGRES_PASSWORD: ${ATHLONE_DB_PASSWORD}
      POSTGRES_DB: ${ATHLONE_DB_NAME}
    volumes:
      - appplus_athlone_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ATHLONE_DB_USER} -d ${ATHLONE_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app_athlone:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${ATHLONE_DATABASE_URL}
      AUTH_SECRET: ${ATHLONE_AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${ATHLONE_AUTH_URL}
      NODE_ENV: production
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PRIVATE_STORAGE_PATH: ${PRIVATE_STORAGE_PATH:-.data/storage}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3101:3000"
    depends_on:
      postgres_athlone:
        condition: service_healthy

  postgres_mullingar:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MULLINGAR_DB_USER}
      POSTGRES_PASSWORD: ${MULLINGAR_DB_PASSWORD}
      POSTGRES_DB: ${MULLINGAR_DB_NAME}
    volumes:
      - appplus_mullingar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MULLINGAR_DB_USER} -d ${MULLINGAR_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app_mullingar:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${MULLINGAR_DATABASE_URL}
      AUTH_SECRET: ${MULLINGAR_AUTH_SECRET}
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${MULLINGAR_AUTH_URL}
      NODE_ENV: production
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      PRIVATE_STORAGE_PATH: ${PRIVATE_STORAGE_PATH:-.data/storage}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3102:3000"
    depends_on:
      postgres_mullingar:
        condition: service_healthy

  backup_athlone:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-athlone-backup
    restart: unless-stopped
    depends_on:
      postgres_athlone:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/backup.sh athlone postgres_athlone 5432 ${ATHLONE_DB_NAME:-appplus_athlone} ${ATHLONE_DB_USER:-postgres} ${ATHLONE_DB_PASSWORD:-postgres} /app/backups ${BACKUP_RETENTION_DAYS:-14}; sleep ${BACKUP_INTERVAL_SECONDS:-86400}; done"

  backup_mullingar:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-mullingar-backup
    restart: unless-stopped
    depends_on:
      postgres_mullingar:
        condition: service_healthy
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/backup.sh mullingar postgres_mullingar 5432 ${MULLINGAR_DB_NAME:-appplus_mullingar} ${MULLINGAR_DB_USER:-postgres} ${MULLINGAR_DB_PASSWORD:-postgres} /app/backups ${BACKUP_RETENTION_DAYS:-14}; sleep ${BACKUP_INTERVAL_SECONDS:-86400}; done"


  backup_verify_athlone:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-athlone-backup-verify
    restart: unless-stopped
    depends_on:
      postgres_athlone:
        condition: service_healthy
      backup_athlone:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/restore-smoke.sh athlone postgres_athlone 5432 ${ATHLONE_DB_NAME:-appplus_athlone} ${ATHLONE_DB_USER:-postgres} ${ATHLONE_DB_PASSWORD:-postgres} /app/backups; sleep ${BACKUP_VERIFY_INTERVAL_SECONDS:-604800}; done"

  backup_verify_mullingar:
    build:
      context: .
      dockerfile: Dockerfile.backup-tools
    container_name: casino-mullingar-backup-verify
    restart: unless-stopped
    depends_on:
      postgres_mullingar:
        condition: service_healthy
      backup_mullingar:
        condition: service_started
    volumes:
      - ./:/app
    working_dir: /app
    command: sh -c "while true; do /app/scripts/restore-smoke.sh mullingar postgres_mullingar 5432 ${MULLINGAR_DB_NAME:-appplus_mullingar} ${MULLINGAR_DB_USER:-postgres} ${MULLINGAR_DB_PASSWORD:-postgres} /app/backups; sleep ${BACKUP_VERIFY_INTERVAL_SECONDS:-604800}; done"

volumes:
  appplus_athlone_pgdata:
  appplus_mullingar_pgdata:
